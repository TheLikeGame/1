# docker-compose.yml
version: '3.8'
services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=yourdomain.com
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://yourdomain.com/
      - N8N_EDITOR_BASE_URL=https://yourdomain.com/
      - N8N_PROXY_HOPS=1
    volumes:
      - ~/.n8n:/home/node/.n8n